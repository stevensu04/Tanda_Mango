# Render Blueprint. All room state lives in memory, so this must stay at exactly one instance.
services:
  - type: web
    name: jailbreak-the-bouncer
    runtime: docker
    plan: free
    branch: main
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # Deploys from main. The CI deploy job fires the deploy hook on every push to main,
    # whether or not tests pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
