# Render Blueprint. All room state lives in memory, so this must stay at exactly one instance.
services:
  - type: web
    name: jailbreak-the-bouncer
    runtime: docker
    plan: free
    branch: deploy-site
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # Deploy only from deploy-site (merge main -> deploy-site to release). The CI deploy job fires the
    # deploy hook on every deploy-site push, whether or not tests pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
